<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Just+Me+Again+Down+Here&display=swap" rel="stylesheet">
    <link href="styles.css" rel="Stylesheet">
    <script src="script.js" defer></script>
    <title>Every Picture</title>
</head>
<body>
    <main>
        <div id="images">
            <img src="images/switch-gif-1.gif" alt="image of my old nintendo switch" id="switch">
            <img src="images/sketchbook-gif.gif" alt="image of my old sketchbook" id="sketchbook">
            <img src="images/docs-gif.gif" alt="image of my old oxford doc martens" id="docs">
            <img src="images/Aris-gif.gif" alt="image of my cat, Aris" id="cat">  
        </div>
        <div id="speech-bubbles">
            <div id="bubble-1">The battery doesn't charge anymore...</div>
            <div id="bubble-2">These fell apart years ago...</div>
            <div id="bubble-3">I used to draw every day...</div>
            <div id="bubble-4">Aris, my best friend...</div>
        </div>
        <img src="images/bedroom-bw.jpg" alt="image of my old bedroom" id="overlay">
    </main>
    <h1>My room...</h1>
</body>
</html>
