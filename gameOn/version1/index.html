<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Averia+Sans+Libre:wght@400;700&display=swap" rel="stylesheet">
	<link href="styles.css" rel="stylesheet">
    <script src="script.js" defer></script>
    <title>Game On</title>
</head>
<body>
    <div id="intro">
        <img id="intro-image" src="images/intro-image.PNG" width="500">
        <div id="title-info">
            <img src="images/logo.PNG" width="550">
            <div id="title-buttons">
                <h3 id="start">Start Game</h3>
                <h3 id="rules">Rules</h3>
            </div>
        </div>
    </div>
    <div id="play-area">
        <div id="kitchen">
            <img id="mariCooking" src="images/mariCooking.GIF" width="350">
            <img id="mariReading" src="images/mariReading.GIF" width="420">
            <img id="lilaCooking" src="images/lilaCooking.GIF" width="500">
            <img id="lilaSleeping" src="images/lilaSleeping.GIF" width="450">
        </div>
        <div id="gamecontrol">
            <div id="scoreArea">
                <div id="playerOne">
                    <h2 id="scoreOne">0</h2>
                    <p>Mari's Score</p>
                </div>
                <div id="actionsStyle">
                    <div id="game">
                        <img src="images/one.PNG" width="150">
                        <img src="images/two.PNG" width="150">
                    </div>
                    <div id="actions">
                        <h3>Roll!</h3>
                    </div>
                </div>
                <div id="playerTwo">
                    <h2 id="scoreTwo">0</h2>
                    <p>Lila's Score</p>
                </div>
            </div>
            <div id="tools">
                <p>Quit</p>
                <p>Rules</p>
            </div>
        </div>
    </div>
</body>
</html>
